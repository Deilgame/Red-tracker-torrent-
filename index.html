<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Red tracker</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<style>
:root{--bg:#050203;--panel:#0c0607;--line:#5a0d14;--red:#ff1e2d;--red2:#b30f1c;--tx:#f2e9ea;--mut:#9b8a8c;--glow:0 0 14px rgba(255,30,45,.45)}
body.light{--bg:#f4eeee;--panel:#fff;--line:#d9a4a8;--tx:#220d0f;--mut:#7a5f62;--glow:0 0 8px rgba(200,20,30,.25)}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden}
body{background:radial-gradient(1200px 500px at 90% 0,rgba(255,30,45,.14),transparent 60%),radial-gradient(700px 500px at 0 100%,rgba(255,30,45,.16),transparent 60%),var(--bg);color:var(--tx);font:15px 'Segoe UI',system-ui,sans-serif;display:grid;grid-template-columns:240px 1fr;grid-template-rows:96px 1fr 64px;gap:0 18px;padding:12px 16px 12px 12px;user-select:none}
.logo{grid-row:1;display:grid;place-items:center}
.logo svg{width:84px;height:84px;filter:drop-shadow(0 0 10px rgba(255,30,45,.8))}
header{display:flex;align-items:center;gap:14px;-webkit-app-region:drag}
header>*{-webkit-app-region:no-drag}
.sp{flex:1;-webkit-app-region:drag}
.cut{clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px))}
.btn{display:flex;align-items:center;gap:12px;padding:0 24px;height:56px;color:var(--tx);background:linear-gradient(180deg,rgba(255,30,45,.22),rgba(255,30,45,.05));border:0;font:inherit;cursor:pointer;position:relative;box-shadow:inset 0 0 0 1px var(--red2)}
.btn:hover{background:linear-gradient(180deg,rgba(255,30,45,.4),rgba(255,30,45,.1))}
.btn i{font:normal 26px/1 'Segoe UI Symbol',sans-serif;color:var(--red)}
.wc{display:flex;gap:6px;border-left:1px solid var(--line);padding-left:14px}
.wc button{width:36px;height:36px;background:none;border:0;color:var(--tx);font-size:18px;cursor:pointer;border-radius:4px}
.wc button:hover{background:rgba(255,30,45,.3)}
nav{grid-row:2;display:flex;flex-direction:column;gap:10px;padding-top:8px}
nav a{display:flex;align-items:center;gap:16px;height:62px;padding:0 20px;cursor:pointer;color:var(--tx);clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,0 100%)}
nav a i{font:normal 26px/1 'Segoe UI Symbol';width:34px;color:var(--mut)}
nav a:hover{background:rgba(255,30,45,.1)}
nav a.on{background:linear-gradient(90deg,rgba(255,30,45,.55),rgba(255,30,45,.12));box-shadow:inset 3px 0 var(--red)}
nav a.on i{color:var(--red)}
main{grid-row:2;background:rgba(0,0,0,.35);border:1px solid var(--line);box-shadow:var(--glow),inset 0 0 40px rgba(255,30,45,.08);padding:14px;overflow:hidden;display:flex;flex-direction:column;border-radius:4px}
body.light main{background:rgba(255,255,255,.6)}
.row{display:grid;grid-template-columns:2.6fr .8fr 1.7fr 1.1fr 1.1fr 1fr 104px;align-items:center;gap:8px;padding:0 18px;min-height:54px;background:var(--panel);border:1px solid var(--line);border-radius:6px;margin-bottom:8px}
.row.h{min-height:46px;color:var(--mut);cursor:default}
.row.h span[data-k]{cursor:pointer}.row.h span[data-k]:hover{color:var(--tx)}
.row.t{cursor:pointer}.row.t:hover,.row.t.sel{border-color:var(--red);box-shadow:var(--glow)}
.list{overflow:auto;flex:1}
.nm{display:flex;align-items:center;gap:12px;overflow:hidden}
.nm b{font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ic{flex:none;width:34px;height:40px;background:var(--red);border-radius:4px;display:grid;place-items:center;font-weight:700;color:#000}
.bar{height:11px;border-radius:6px;background:rgba(128,128,128,.25);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--red2),var(--red));box-shadow:var(--glow)}
.st{text-align:center;font-size:13px}
.st small{display:block;margin-top:2px;color:var(--tx)}
.dn{color:var(--red)}
.act{display:flex;gap:4px;opacity:0}.row.t:hover .act,.row.t.sel .act{opacity:1}
.act button{width:30px;height:30px;border:1px solid var(--line);background:none;color:var(--tx);border-radius:4px;cursor:pointer}
.act button:hover{background:var(--red2)}
.empty{margin:auto;text-align:center;color:var(--mut);line-height:1.8}
footer{grid-column:2;grid-row:3;display:flex;align-items:center;gap:26px;padding:0 26px;border:1px solid var(--line);background:rgba(0,0,0,.3);border-radius:4px;box-shadow:var(--glow)}
body.light footer{background:rgba(255,255,255,.6)}
footer span{display:flex;gap:10px;align-items:center}footer i{font:normal 20px 'Segoe UI Symbol';color:var(--red)}
footer em{width:1px;height:28px;background:var(--line)}
.set{max-width:560px;display:flex;flex-direction:column;gap:18px;padding:10px;user-select:text}
.set label{display:flex;flex-direction:column;gap:6px;color:var(--mut)}
.set input{background:var(--panel);border:1px solid var(--line);color:var(--tx);padding:11px;border-radius:5px;font:inherit}
.set .pr{display:flex;gap:8px}.set .pr input{flex:1}
.mod{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;place-items:center;z-index:9}
.mod.on{display:grid}.mod>div{width:560px;background:var(--panel);border:1px solid var(--red);box-shadow:var(--glow);padding:24px;border-radius:6px;display:flex;flex-direction:column;gap:14px}
.mod input{background:var(--bg);border:1px solid var(--line);color:var(--tx);padding:12px;border-radius:5px;font:inherit;user-select:text}
.mod .pr{display:flex;gap:10px;justify-content:flex-end}
.drop{outline:2px dashed var(--red);outline-offset:-10px}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--red);outline-offset:2px}
</style></head><body>
<div class="logo"><svg viewBox="0 0 100 100"><ellipse cx="50" cy="50" rx="44" ry="34" fill="none" stroke="#ff1e2d" stroke-width="5" transform="rotate(-18 50 50)"/><text x="50" y="70" text-anchor="middle" font-size="64" font-weight="900" fill="#ff1e2d" font-family="Georgia,serif">R</text></svg></div>
<header>
  <button class="btn cut" id="bFile"><i>＋</i>Добавить файл</button>
  <button class="btn cut" id="bMag"><i>🔗︎</i>Добавить магнет ссылку</button>
  <button class="btn cut" id="bNew"><i>⬆</i>Создать торрент</button>
  <div class="sp"></div>
  <div class="wc"><button id="bTheme" title="Тема">☀</button><button id="wMin">—</button><button id="wMax">☐</button><button id="wClose">✕</button></div>
</header>
<nav>
  <a data-v="active" class="on" tabindex="0"><i>⬇</i>Загрузка</a>
  <a data-v="all" tabindex="0"><i>☰</i>Список загрузок</a>
  <a data-v="set" tabindex="0"><i>⚙</i>Настройки</a>
</nav>
<main id="main"></main>
<footer><span><i>▮▮▮</i><b id="fD">0 Б/с</b></span><em></em><span><i>⬆</i><b id="fU">0 Б/с</b></span><em></em><span><i>▭</i>Свободно: <b id="fF">—</b></span></footer>
<div class="mod" id="mod"><div><b>Добавить магнет ссылку</b><input id="mIn" placeholder="magnet:?xt=urn:btih:…"><div class="pr"><button class="btn cut" id="mNo" style="height:44px">Отмена</button><button class="btn cut" id="mOk" style="height:44px">Добавить</button></div></div></div>
<script>
const $=s=>document.querySelector(s);
let S={torrents:[],free:0,down:0,up:0},view='active',sort={k:null,d:-1},sel=null;
const fmt=b=>{if(!b)return'0 Б';const u=['Б','КБ','МБ','ГБ','ТБ'];const i=Math.min(4,Math.floor(Math.log(b)/Math.log(1024)));return(b/1024**i).toFixed(i?1:0)+' '+u[i]};
const spd=b=>fmt(b)+'/с';
const eta=t=>{if(t.done)return'—';if(!isFinite(t.eta)||t.eta<=0||t.paused)return'∞';let s=Math.round(t.eta/1000);const p=n=>String(n).padStart(2,'0');return p(s/3600|0)+':'+p(s%3600/60|0)+':'+p(s%60)};
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const label=t=>t.paused?'Пауза':!t.ready?'Метаданные':t.done?'Раздача':Math.floor(t.progress*100)+'%';
const keys={size:t=>t.size,status:t=>t.progress,down:t=>t.down,up:t=>t.up};
function render(){
  $('#fD').textContent=spd(S.down);$('#fU').textContent=spd(S.up);$('#fF').textContent=S.free?fmt(S.free):'—';
  if(view==='set')return;
  let l=S.torrents.filter(t=>view==='all'||!t.done);
  if(sort.k)l=[...l].sort((a,b)=>(keys[sort.k](a)-keys[sort.k](b))*sort.d);
  const arr=k=>`<span data-k="${k}">${sort.k===k?(sort.d>0?'↑':'↓'):'⇕'}</span>`;
  let h=`<div class="row h"><span>Имя</span><span data-k="size">Размер ⇕</span><span data-k="status">Статус ⇕</span><span data-k="down">Скорость ⇕</span><span data-k="up">Отдача ⇕</span><span>Время</span><span></span></div><div class="list">`;
  if(!l.length)h+=`<div class="empty" style="height:100%;display:flex;flex-direction:column;justify-content:center">Здесь пока пусто.<br>Нажмите «Добавить файл», вставьте магнет-ссылку<br>или перетащите .torrent в окно.</div>`;
  for(const t of l)h+=`<div class="row t ${t.hash===sel?'sel':''}" data-h="${t.hash}">
   <div class="nm"><div class="ic">R</div><b title="${esc(t.name)}">${esc(t.name)}</b></div><span>${t.size?fmt(t.size):'—'}</span>
   <div class="st"><div class="bar"><i style="width:${(t.progress*100).toFixed(1)}%"></i></div><small>${label(t)}</small></div>
   <span class="dn">${t.down?'↓ ':''}${t.done||t.paused?'—':spd(t.down)}</span><span>${t.up?'↑ ':''}${spd(t.up)}</span><span>◔ ${eta(t)}</span>
   <div class="act"><button data-a="${t.paused?'resume':'pause'}" title="${t.paused?'Продолжить':'Пауза'}">${t.paused?'▶':'❚❚'}</button><button data-a="open" title="Открыть папку">📂︎</button><button data-a="remove" title="Удалить">✕</button></div></div>`;
  $('#main').innerHTML=h+'</div>';
}
async function settings(){
  const s=await api.getSettings();
  $('#main').innerHTML=`<div class="set"><b style="font-size:20px">Настройки</b>
  <label>Папка загрузки<div class="pr"><input id="sP" value="${esc(s.downloadPath)}" readonly><button class="btn cut" id="sB" style="height:44px">Выбрать</button></div></label>
  <label>Лимит скорости загрузки, КБ/с (0 — без ограничений)<input id="sD" type="number" min="0" value="${s.maxDown}"></label>
  <label>Лимит скорости отдачи, КБ/с (0 — без ограничений)<input id="sU" type="number" min="0" value="${s.maxUp}"></label>
  <button class="btn cut" id="sS" style="width:200px;justify-content:center">Сохранить</button><span id="sOk" style="color:var(--red)"></span></div>`;
  $('#sB').onclick=async()=>{const d=await api.pickDir();if(d)$('#sP').value=d};
  $('#sS').onclick=async()=>{await api.setSettings({downloadPath:$('#sP').value,maxDown:$('#sD').value,maxUp:$('#sU').value});$('#sOk').textContent='Сохранено'};
}
function go(v){view=v;document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.dataset.v===v));v==='set'?settings():render()}
document.querySelectorAll('nav a').forEach(a=>{a.onclick=()=>go(a.dataset.v);a.onkeydown=e=>e.key==='Enter'&&go(a.dataset.v)});
$('#main').addEventListener('mousedown',e=>{
  const b=e.target.closest('[data-a]');const r=e.target.closest('.row.t');
  if(b&&r){api.action(b.dataset.a,r.dataset.h);return}
  if(r){sel=r.dataset.h;render();return}
  const k=e.target.closest('[data-k]');
  if(k){const key=k.dataset.k;sort=sort.k===key?{k:key,d:-sort.d}:{k:key,d:-1};render()}
});
$('#bFile').onclick=()=>api.addFile();
$('#bNew').onclick=()=>api.create();
$('#bMag').onclick=()=>{$('#mIn').value='';$('#mod').classList.add('on');$('#mIn').focus()};
$('#mNo').onclick=()=>$('#mod').classList.remove('on');
$('#mOk').onclick=()=>{api.addMagnet($('#mIn').value);$('#mod').classList.remove('on')};
$('#mIn').onkeydown=e=>{if(e.key==='Enter')$('#mOk').click();if(e.key==='Escape')$('#mNo').click()};
$('#wMin').onclick=()=>api.win('min');$('#wMax').onclick=()=>api.win('max');$('#wClose').onclick=()=>api.win('close');
$('#bTheme').onclick=()=>{document.body.classList.toggle('light');try{localStorage.theme=document.body.classList.contains('light')?'l':'d'}catch{}};
try{if(localStorage.theme==='l')document.body.classList.add('light')}catch{}
addEventListener('dragover',e=>{e.preventDefault();document.body.classList.add('drop')});
addEventListener('dragleave',()=>document.body.classList.remove('drop'));
addEventListener('drop',e=>{e.preventDefault();document.body.classList.remove('drop');
  for(const f of e.dataTransfer.files)api.addPath(api.pathFor(f));
  const t=e.dataTransfer.getData('text');if(t&&t.startsWith('magnet:'))api.addMagnet(t)});
api.onState(s=>{S=s;render()});
render();
</script></body></html>
